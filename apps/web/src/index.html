<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AndThen</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Small habits, linked to what you already do." />
    <meta name="theme-color" content="#1E6B5C" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply saved look settings before the app boots, so the page doesn't flash.
      try {
        var prefs = JSON.parse(localStorage.getItem('andthen.prefs') || '{}');
        var theme = prefs.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        if (/^(blue|plum|clay|slate)$/.test(prefs.accent)) {
          document.documentElement.dataset.accent = prefs.accent;
        }
        if (prefs.largeText === true) document.documentElement.dataset.text = 'large';
        if (prefs.moreContrast === true) document.documentElement.dataset.contrast = 'more';
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use AndThen.</noscript>
  </body>
</html>
